<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual QA Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent: #4299e1;
            --accent-hover: #3182ce;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,100%,94%,1) 0px, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225,100%,94%,1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,100%,94%,1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; font-weight: 600; }
        
        header {
            text-align: center;
            padding: 40px 20px;
        }
        header h1 {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 10px;
        }
        header p { color: var(--text-muted); font-size: 1.1rem; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* GLASS CARD */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }

        /* UPLOAD GRID */
        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .dropzone {
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed rgba(66, 153, 225, 0.3);
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .dropzone:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.1);
        }

        .dropzone .icon { font-size: 2.5rem; margin-bottom: 15px; }
        .dropzone input[type="file"] { display: none; }
        .dropzone h3 { margin-bottom: 5px; color: var(--text-main); }
        .dropzone p { color: var(--text-muted); font-size: 0.9rem; }
        .filename { margin-top: 15px; font-size: 0.9rem; color: var(--accent); font-weight: 600; }

        /* BUTTON */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 153, 225, 0.3);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 153, 225, 0.4);
        }
        .btn-primary:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* SKELETON LOADER */
        .loader {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loader h3 { color: var(--accent); margin-bottom: 20px; animation: pulse 1.5s infinite; }
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.4) 25%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.4) 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite linear;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .card-skel { height: 180px; margin-bottom: 24px; }
        .row-skel { height: 20px; }
        .w-80 { width: 80%; }
        .w-60 { width: 60%; }

        @keyframes skeletonLoading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* RESULTS AREA */
        .results { display: none; animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .score-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(66, 153, 225, 0.1);
            color: var(--accent);
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 24px;
        }
        .img-col h4 { text-align: center; margin-bottom: 10px; color: var(--text-muted); font-size: 0.95rem; }
        .img-col img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.05);
            background: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        /* MARKDOWN STYLES */
        .md-content { margin-top: 20px; }
        .md-content h2, .md-content h3 { color: var(--text-main); margin: 24px 0 16px; }
        .md-content h2 { border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 8px; font-size: 1.6rem; }
        .md-content p, .md-content li { line-height: 1.7; margin-bottom: 12px; }
        .md-content ul, .md-content ol { margin-left: 20px; margin-bottom: 16px; }
        .md-content strong { color: var(--text-main); font-weight: 600; }
        
        .md-content table { width: 100%; border-collapse: collapse; margin: 20px 0; background: rgba(255,255,255,0.5); border-radius: 8px; overflow: hidden; }
        .md-content th { text-align: left; padding: 14px; background: rgba(66, 153, 225, 0.1); color: var(--accent); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .md-content td { padding: 14px; border-bottom: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <header>
        <h1>Visual QA Studio</h1>
        <p>Drop your Figma and Web screenshots below for AI analysis</p>
    </header>

    <div class="container">
        
        <!-- UPLOAD SECTION -->
        <section class="glass-panel" id="uploadSection">
            <form id="uploadForm">
                <div class="upload-grid">
                    <div class="dropzone" id="figmaZone" onclick="document.getElementById('figmaFile').click()">
                        <div class="icon">🎨</div>
                        <h3>Figma Design</h3>
                        <p>Click or drag image</p>
                        <div class="filename" id="figmaFilename"></div>
                        <input type="file" id="figmaFile" accept="image/png, image/jpeg" required>
                    </div>

                    <div class="dropzone" id="webZone" onclick="document.getElementById('webFile').click()">
                        <div class="icon">🌐</div>
                        <h3>Live Web</h3>
                        <p>Click or drag image</p>
                        <div class="filename" id="webFilename"></div>
                        <input type="file" id="webFile" accept="image/png, image/jpeg" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="analyzeBtn">Run Visual Analysis 🚀</button>
            </form>
        </section>

        <!-- LOADER -->
        <section class="glass-panel loader" id="loader">
            <h3>Analyzing pixels and running AI...</h3>
            <div class="skeleton card-skel"></div>
            <div class="skeleton row-skel"></div>
            <div class="skeleton row-skel w-80"></div>
            <div class="skeleton row-skel w-60"></div>
        </section>

        <!-- RESULTS SECTION -->
        <div class="results" id="results">
            
            <section class="glass-panel">
                <h2>Visual Diff & Heatmap</h2>
                <div class="score-badge">SSIM Match: <span id="ssimScore"></span></div>
                
                <div class="image-grid">
                    <div class="img-col">
                        <h4>Design</h4>
                        <img id="outFigmaImg" alt="Figma Design">
                    </div>
                    <div class="img-col">
                        <h4>Implementation</h4>
                        <img id="outWebImg" alt="Web Screenshot">
                    </div>
                    <div class="img-col">
                        <h4>Heatmap</h4>
                        <img id="heatmapImg" alt="Diff Heatmap">
                    </div>
                </div>
            </section>

            <section class="glass-panel">
                <div class="md-content" id="markdownReport"></div>
            </section>

        </div>

    </div>

    <script>
        // File selection display
        document.getElementById('figmaFile').addEventListener('change', (e) => {
            if(e.target.files[0]) document.getElementById('figmaFilename').textContent = e.target.files[0].name;
        });
        document.getElementById('webFile').addEventListener('change', (e) => {
            if(e.target.files[0]) document.getElementById('webFilename').textContent = e.target.files[0].name;
        });

        // Form Submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const figmaFile = document.getElementById('figmaFile').files[0];
            const webFile = document.getElementById('webFile').files[0];
            
            if (!figmaFile || !webFile) {
                alert("Please select both images!");
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');

            // UI State updates
            btn.disabled = true;
            btn.textContent = "Analyzing...";
            results.style.display = 'none';
            loader.style.display = 'block';

            const formData = new FormData();
            formData.append('figma_image', figmaFile);
            formData.append('web_image', webFile);

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || "Server error");
                }

                const data = await response.json();

                // Populate Results
                document.getElementById('ssimScore').textContent = (data.ssim_score * 100).toFixed(1) + "%";
                document.getElementById('heatmapImg').src = "data:image/png;base64," + data.heatmap_b64;
                
                // Show uploaded images
                document.getElementById('outFigmaImg').src = URL.createObjectURL(figmaFile);
                document.getElementById('outWebImg').src = URL.createObjectURL(webFile);

                document.getElementById('markdownReport').innerHTML = marked.parse(data.markdown_report);

                // Show Results
                loader.style.display = 'none';
                results.style.display = 'block';

                // Smooth scroll down to results
                setTimeout(() => {
                    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
                }, 100);

            } catch (error) {
                alert("Error: " + error.message);
                loader.style.display = 'none';
            } finally {
                btn.disabled = false;
                btn.textContent = "Run Visual Analysis 🚀";
            }
        });
    </script>
</body>
</html>
